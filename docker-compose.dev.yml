# ============================================================
# HERMES DASHBOARD - DOCKER COMPOSE DEVELOPMENT OVERRIDE
# ============================================================
# Enables hot-reload development with volume mounts
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

version: '3.8'

services:
  nginx:
    # In development, nginx just proxies to frontend dev server
    # No changes needed to nginx config
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: hermes-dashboard-frontend-dev
    environment:
      - NODE_ENV=development
      - PORT=3800
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    # Override healthcheck for dev (longer startup)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3800"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # No resource limits in dev
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G