name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Enforce Richard's full standard: lint clean, typecheck (app + tests),
# >=90% coverage gate, E2E green.
permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Unit (>=90% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + Typecheck (must be clean)
        run: npm run lint:check

      - name: Unit tests + coverage gate (>=90%)
        # vitest.config.ts thresholds fail the run if coverage drops below 90%.
        # (Test files are type-checked implicitly by vitest's esbuild transform;
        # a separate tsc pass is omitted to avoid the vitest/Bundler
        # 'no exported member' resolution quirk — the app typecheck
        # above already covers src/.)
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E (live data, self-contained)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HERMES_HOME: /opt/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Provision Playwright (not in lockfile to keep npm ci clean)
        # 1.51.1 satisfies next@15.5.4's peerOptional ^1.51.1;
        # legacy-peer-deps avoids any transient conflict.
        run: npm install --no-save --legacy-peer-deps @playwright/test@1.51.1 && npx playwright install --with-deps chromium

      - name: Build app (direct adapter API, served at root)
        env:
          # Frontend talks DIRECTLY to the live adapter (CORS-enabled), exactly
          # like the production tunnel mode — no basePath/subpath needed for E2E.
          NEXT_PUBLIC_API_URL: http://localhost:3801
          NEXT_PUBLIC_HERMES_API: http://localhost:3801
        run: npm run build

      # Adapter + dashboard MUST stay alive during the E2E run, so they are
      # started in the SAME step as playwright (GitHub Actions terminates
      # background processes spawned in a prior step).
      - name: Seed fixtures + run adapter + dashboard + E2E
        env:
          BASE_URL: http://localhost:3800
        run: |
          set -u
          # 1) Seed fixture boards into HERMES_HOME for the adapter.
          ( cd ../backend && python3 seed_test_boards.py )

          # 2) Start the Hermes adapter (real live data) in the background.
          ( cd ../backend && HERMES_HOME="$HERMES_HOME" python3 hermes_adapter.py --port 3801 --host 0.0.0.0 ) &
          ADAPTER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3801/health >/dev/null 2>&1; then
              echo "adapter up"; break
            fi
            sleep 1
          done

          # 3) Start the built dashboard (next start :3800) in the background.
          PORT=3800 npm run start &
          NEXT_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3800/ >/dev/null 2>&1; then
              echo "dashboard up"; break
            fi
            sleep 1
          done

          # 4) Run the E2E suite while both servers are alive.
          npm run test:e2e
          E2E_RC=$?

          # 5) Teardown.
          kill "$NEXT_PID" 2>/dev/null || true
          kill "$ADAPTER_PID" 2>/dev/null || true
          exit $E2E_RC

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7