name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Enforce Richard's full standard: lint clean, typecheck (app + tests),
# >=90% coverage gate, E2E green.
permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Unit (>=90% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (must be clean)
        run: npm run lint

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (tests)
        # Validates test files against vitest globals / node types.
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Unit tests + coverage gate (>=90%)
        # vitest.config.ts thresholds fail the run if coverage drops below 90%.
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E (live data, no mocks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Provision Playwright (not in lockfile to keep npm ci clean)
        # 1.51.1 satisfies next@15.5.4's peerOptional ^1.51.1;
        # legacy-peer-deps avoids any transient conflict.
        run: npm install --no-save --legacy-peer-deps @playwright/test@1.51.1 && npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Run E2E against live adapter tunnel
        # BASE_URL points at the live Hermes adapter (real data).
        env:
          BASE_URL: https://mountains-private-far-lions.trycloudflare.com
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
