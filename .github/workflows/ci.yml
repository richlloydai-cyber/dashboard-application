name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Enforce Richard's full standard: lint clean, typecheck (app + tests),
# >=90% coverage gate, E2E green.
permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Unit (>=90% coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (must be clean)
        run: npm run lint

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Unit tests + coverage gate (>=90%)
        # vitest.config.ts thresholds fail the run if coverage drops below 90%.
        # (Test files are type-checked implicitly by vitest's esbuild transform;
        # a separate tsc pass is omitted to avoid the vitest/Bundler
        # 'no exported member' resolution quirk — the app typecheck
        # above already covers src/.)
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E (live data, self-contained)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HERMES_HOME: /opt/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Provision Playwright (not in lockfile to keep npm ci clean)
        # 1.51.1 satisfies next@15.5.4's peerOptional ^1.51.1;
        # legacy-peer-deps avoids any transient conflict.
        run: npm install --no-save --legacy-peer-deps @playwright/test@1.51.1 && npx playwright install --with-deps chromium

      - name: Seed fixture boards for the adapter
        working-directory: backend
        run: python3 seed_test_boards.py

      - name: Start Hermes adapter (live data)
        working-directory: backend
        run: |
          python3 hermes_adapter.py --port 3801 --host 0.0.0.0 &
          echo $! > /tmp/adapter.pid
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3801/health >/dev/null 2>&1; then
              echo "adapter up"; break
            fi
            sleep 1
          done

      - name: Build app (subpath + same-origin API proxy)
        env:
          NEXT_PUBLIC_DASHBOARD_PATH: /projects
          NEXT_PUBLIC_HERMES_API: http://localhost:3801
        run: npm run build

      - name: Start dashboard (next start :3800)
        run: |
          PORT=3800 npm run start &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3800/projects >/dev/null 2>&1; then
              echo "dashboard up"; break
            fi
            sleep 1
          done

      - name: Run E2E against the self-hosted dashboard
        env:
          BASE_URL: http://localhost:3800/projects
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Teardown
        if: always()
        run: |
          [ -f /tmp/next.pid ] && kill "$(cat /tmp/next.pid)" 2>/dev/null || true
          [ -f /tmp/adapter.pid ] && kill "$(cat /tmp/adapter.pid)" 2>/dev/null || true
