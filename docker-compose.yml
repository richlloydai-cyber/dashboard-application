# ============================================================
# HERMES DASHBOARD - DOCKER COMPOSE
# ============================================================
# Services:
#   - nginx: Reverse proxy on port 8080 (exposed to host)
#   - frontend: Next.js 15 dashboard on port 3800 (internal)
#   - Network: hermes-dashboard-net (bridge)
#
# Hermes Backend Services (external, expected on host):
#   - Hermes Backend API: http://host.docker.internal:3801
#   - Hermes WebSocket: ws://host.docker.internal:3802
#   - Hermes SSE: http://host.docker.internal:3801/events
#
# Usage:
#   docker compose up -d --build     # Production build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d  # Dev with hot reload
# ============================================================

version: '3.8'

services:
  # ============================================================
  # BACKEND ADAPTER - Live Hermes project data (Kanban + git/CI)
  # ============================================================
  adapter:
    image: python:3.11-alpine
    container_name: hermes-dashboard-adapter
    working_dir: /app
    command: ["python3", "hermes_adapter.py", "--port", "3801", "--host", "0.0.0.0"]
    environment:
      - HERMES_HOME=/hermes
    volumes:
      - ./backend:/app:ro
      # The dashboard lives inside the Hermes data dir, so the live boards +
      # repo are one level up. Relative paths work on both Windows and Linux.
      - ../kanban:/hermes/kanban:ro
      - ../multi-tenant:/hermes/multi-tenant:ro
    networks:
      - hermes-dashboard-net
    expose:
      - "3801"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3801/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================================
  # NGINX REVERSE PROXY
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: hermes-dashboard-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hermes-dashboard-net
    depends_on:
      - frontend
      - adapter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # FRONTEND - Next.js 15 Dashboard
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: "/projects/api"
        NEXT_PUBLIC_WS_URL: "/projects/ws"
        NEXT_PUBLIC_HERMES_API: "http://host.docker.internal:3801"
        NEXT_PUBLIC_WS_HERMES: "ws://host.docker.internal:3802"
        NEXT_PUBLIC_DASHBOARD_PATH: "/projects"
    container_name: hermes-dashboard-frontend
    environment:
      - NODE_ENV=production
      - PORT=3800
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - hermes-dashboard-net
    expose:
      - "3800"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3800"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# ============================================================
# NETWORKS
# ============================================================
networks:
  hermes-dashboard-net:
    name: hermes-dashboard-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

# ============================================================
# VOLUMES
# ============================================================
volumes:
  frontend-static:
    name: hermes-dashboard-frontend-static