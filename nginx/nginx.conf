# ============================================================
# HERMES DASHBOARD - NGINX MAIN CONFIGURATION
# ============================================================
# Main nginx.conf - Routes /projects to frontend, proxies API/WS to Hermes
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml image/svg+xml
        text/x-js text/x-cross-domain-policy
        application/x-font-ttf application/x-font-opentype
        application/vnd.ms-fontobject image/x-icon;

    # Upstreams
    upstream frontend {
        server frontend:3800;
        keepalive 32;
    }

    # Hermes Backend adapter (in-network service — live Kanban + git/CI data)
    upstream hermes_api {
        server adapter:3801;
        keepalive 32;
    }

    upstream hermes_ws {
        server adapter:3801;
        keepalive 32;
    }

    upstream hermes_sse {
        server adapter:3801;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=sse:10m rate=5r/s;

    # Main server
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        # Health check
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # HERMES API PROXY - /projects/api/*  → adapter (live data)
        # Must come BEFORE the generic /projects block.
        # ============================================================
        location /projects/api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://hermes_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ============================================================
        # HERMES WEBSOCKET PROXY - /projects/ws  → adapter
        # ============================================================
        location = /projects/ws {
            limit_req zone=ws burst=10 nodelay;

            proxy_pass http://hermes_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ============================================================
        # HERMES SSE PROXY - /projects/events  → adapter
        # ============================================================
        location = /projects/events {
            limit_req zone=sse burst=5 nodelay;

            proxy_pass http://hermes_sse/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Accept "text/event-stream";
            proxy_set_header Cache-Control "no-cache";
            proxy_set_header Connection "keep-alive";

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
            proxy_cache off;
        }

        # ============================================================
        # HERMES DASHBOARD - everything under /projects → frontend
        # The frontend is built with basePath=/projects, so the prefix
        # is passed through UNCHANGED (no rewrite).
        # ============================================================
        location /projects {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;
        }

        # ============================================================
        # ROOT - redirect to the dashboard
        # ============================================================
        location = / {
            return 302 /projects;
        }

        # Anything else → frontend (handles Next.js internal paths safely)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}